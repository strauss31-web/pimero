name: Fetch raw Drive files

on:
  push:
    branches: [claude/company-website-whai60]
    paths:
      - 'file-manifest.txt'
      - '.github/workflows/fetch-file.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download raw files from Drive
        run: |
          pip install --quiet requests
          python3 - <<'PY'
          import requests
          from pathlib import Path
          Path('review').mkdir(exist_ok=True)
          for line in Path('file-manifest.txt').read_text().splitlines():
              line = line.strip()
              if not line or line.startswith('#') or '|' not in line:
                  continue
              fid, name = line.split('|', 1)
              url = f'https://drive.usercontent.google.com/download?id={fid}&export=download&confirm=t'
              r = requests.get(url, timeout=300)
              r.raise_for_status()
              Path(f'review/{name}').write_bytes(r.content)
              print('OK', name, len(r.content), r.headers.get('content-type'))
          PY
      - name: Commit fetched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add review
          git diff --cached --quiet || git commit -m "Review: archivos crudos de Drive (temporal)"
          git push
