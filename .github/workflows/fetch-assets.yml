name: Fetch external assets

on:
  push:
    branches: [claude/company-website-whai60]
    paths:
      - 'assets-manifest.txt'
      - '.github/workflows/fetch-assets.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and convert to jpg
        run: |
          pip install --quiet pillow requests
          python3 - <<'PY'
          import requests
          from io import BytesIO
          from pathlib import Path
          from PIL import Image
          Path('assets/img').mkdir(parents=True, exist_ok=True)
          ok = fail = 0
          for line in Path('assets-manifest.txt').read_text().splitlines():
              if '|' not in line:
                  continue
              name, url = line.split('|', 1)
              try:
                  r = requests.get(url, timeout=60)
                  r.raise_for_status()
                  im = Image.open(BytesIO(r.content)).convert('RGB')
                  im.thumbnail((1600, 1600))
                  im.save(f'assets/img/{name}.jpg', 'JPEG', quality=84, optimize=True)
                  print('OK  ', name)
                  ok += 1
              except Exception as e:
                  print('FAIL', name, e)
                  fail += 1
          print(f'downloaded={ok} failed={fail}')
          PY
      - name: Commit fetched assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img
          git diff --cached --quiet || git commit -m "Self-host generated images inside the site"
          git push
